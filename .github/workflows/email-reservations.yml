name: Email Reservations Summary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '_scraper/package-lock.json'

      - name: Install dependencies
        working-directory: _scraper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: _scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: _scraper
        env:
          IXCHEL_EMAIL: ${{ secrets.IXCHEL_EMAIL }}
          IXCHEL_PASSWORD: ${{ secrets.IXCHEL_PASSWORD }}
        run: node scrape-reservations.js



      - name: Send email notification
        if: hashFiles('_scraper/email_summary.txt') != '' && env.MAIL_USERNAME != ''
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Ixchel Calendar Reservations Summary
          to: ${{ secrets.MAIL_USERNAME }}
          from: Ixchel Calendar Bot <${{ secrets.MAIL_USERNAME }}>
          body: file://_scraper/email_summary.txt
      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-screenshot
          path: _scraper/debug.png
          retention-days: 3
