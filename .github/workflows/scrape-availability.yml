name: Scrape Availability

on:
  schedule:
    # Run daily at 6:00 AM UTC (midnight CST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: _scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: _scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: _scraper
        env:
          IXCHEL_EMAIL: ${{ secrets.IXCHEL_EMAIL }}
          IXCHEL_PASSWORD: ${{ secrets.IXCHEL_PASSWORD }}
        run: node scrape-calendar.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet js/availability.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add js/availability.json
          git commit -m "Auto-update availability data [$(date +%Y-%m-%d)]"
          git push

      - name: Send email notification
        if: steps.changes.outputs.changed == 'true' && hashFiles('_scraper/email_summary.txt') != '' && env.MAIL_USERNAME != ''
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Ixchel Calendar Availability Changes
          to: ${{ secrets.MAIL_USERNAME }}
          from: Ixchel Calendar Bot
          body: file://_scraper/email_summary.txt
      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debug-screenshot
          path: _scraper/debug.png
          retention-days: 3
