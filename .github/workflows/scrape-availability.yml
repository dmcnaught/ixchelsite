name: Scrape Availability

on:
  schedule:
    # Run daily at 6:00 AM UTC (midnight CST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '_scraper/package-lock.json'

      - name: Install dependencies
        working-directory: _scraper
        run: npm ci

      - name: Install Playwright browsers
        working-directory: _scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: _scraper
        env:
          IXCHEL_EMAIL: ${{ secrets.IXCHEL_EMAIL }}
          IXCHEL_PASSWORD: ${{ secrets.IXCHEL_PASSWORD }}
          DETAILS_ENCRYPTION_KEY: ${{ secrets.DETAILS_ENCRYPTION_KEY }}
        run: node scrape-calendar.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet js/availability.json js/availability_details.enc 2>/dev/null || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add js/availability.json js/availability_details.enc
          git commit -m "Auto-update availability data [$(date +%Y-%m-%d)]"
          git push

      - name: Send email notification
        if: steps.changes.outputs.changed == 'true' && hashFiles('_scraper/email_summary.txt') != '' && env.MAIL_USERNAME != ''
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@d38f3f7cd391cdebfe0d38efc3998b935e951c4f # v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Ixchel Calendar Availability Changes
          to: ${{ secrets.MAIL_USERNAME }}
          from: Ixchel Calendar Bot <${{ secrets.MAIL_USERNAME }}>
          body: file://_scraper/email_summary.txt
      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: debug-screenshot
          path: _scraper/debug.png
          retention-days: 3
